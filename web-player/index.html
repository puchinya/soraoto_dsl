<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<title>soraotoDSL Web Player</title>
<style>
  :root {
    color-scheme:dark;
    --bg:#090c12; --panel:#111722; --panel2:#171e2b; --panel3:#0d121b;
    --border:#273148; --text:#edf2fb; --muted:#95a2b9;
    --accent:#64b5e8; --accent-strong:#8ed1fa;
    --good:#82d99b; --bad:#ff7e8a;
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{overscroll-behavior:none}
  button,input,select,textarea{font:inherit}
  button{min-height:40px;border:1px solid var(--border);background:var(--panel2);color:var(--text);
    border-radius:10px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
  button:hover{border-color:#415071}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:#17415a;border-color:#2f84af;color:#f7fcff}
  button.danger{background:#3d1d27;border-color:#78404c}
  button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.35)}
  input[type="number"],select{border:1px solid var(--border);background:var(--panel3);color:var(--text);
    border-radius:10px;padding:9px 10px;min-height:40px}
  input[type="number"]{width:80px}
  select{min-width:0;max-width:100%}

  .app{width:100%;height:100dvh;min-height:0;overflow:hidden;display:grid;
    grid-template-rows:auto auto auto minmax(0,1fr) auto;position:relative}
  .busy-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    background:rgba(7,10,15,.64);backdrop-filter:blur(3px);padding:20px}
  .app.busy .busy-overlay{display:flex}
  .busy-card{width:min(320px,90vw);padding:18px 20px;border-radius:16px;border:1px solid var(--border);
    background:#121925;box-shadow:0 16px 50px rgba(0,0,0,.45);display:flex;align-items:center;gap:13px;font-weight:700}
  .spinner{width:21px;height:21px;border:3px solid #2a354a;border-top-color:var(--accent-strong);
    border-radius:50%;animation:spin .75s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  header{border-bottom:1px solid var(--border);background:#0d121a;padding:10px 12px;display:grid;gap:9px}
  .brand-row{display:flex;align-items:center;gap:10px;min-width:0}
  .brand{font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .brand-badge{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 6px}
  .state-pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:4px 9px;border:1px solid var(--border);
    border-radius:999px;color:var(--muted);font-size:12px;white-space:nowrap}
  .status{margin-left:auto;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status.ok{color:var(--good)} .status.error{color:var(--bad)}

  .persistent-controls{background:#0d121a;border-bottom:1px solid var(--border);padding:8px 12px}
  .persistent-control-label{display:none;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;margin-bottom:5px}
  .song-row{display:grid;grid-template-columns:auto minmax(180px,1fr) auto auto auto;gap:8px;align-items:center}
  .song-row label{font-size:12px;color:var(--muted)}
  .persistent-bpm{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .persistent-compile{font-weight:700}
  #sampleSelect{width:100%}

  .tool-panel{background:#0d121a;border-bottom:1px solid var(--border);padding:8px 12px}
  .tool-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tool-controls label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
  .debug-panel{margin:8px 12px 4px;border:1px solid var(--border);border-radius:10px;background:#080c12;overflow:hidden}
  .debug-panel[hidden]{display:none}
  .debug-toolbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);background:#0b1018}
  .debug-toolbar strong{font-size:12px;letter-spacing:.04em}
  .debug-toolbar .spacer{flex:1}
  .debug-toolbar button{padding:5px 9px;min-height:0}
  .debug-log{margin:0;padding:10px;min-height:120px;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#b8c8df;background:#06090e}
  .debug-trace-toggle input{accent-color:#6eb7e6}
  .transport-controls{display:flex;gap:8px;align-items:center}
  .transport-controls #playBtn,.transport-controls #stopBtn{min-width:96px;font-weight:750}
  .transport-spacer{flex:1}

  .mobile-tabs{display:none;background:#0d121a;border-bottom:1px solid var(--border);padding:7px 10px;gap:6px}
  .mobile-tab{flex:1;min-height:38px;padding:7px 9px;color:var(--muted);font-size:12px}
  .mobile-tab.active{background:#1a3447;border-color:#346d8d;color:#eaf7ff}

  main{min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(360px,1.05fr) minmax(340px,.95fr)}
  .editor-pane,.preview-pane{min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .editor-pane{border-right:1px solid var(--border)}
  .pane-title{padding:8px 11px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    background:#0d121a;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  #editor{flex:1;min-height:380px;resize:none;border:0;outline:0;padding:15px;background:#090e15;color:#dce7fa;
    font:14px/1.58 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
  .preview-pane{overflow:hidden;background:#0c1119}
  #timelineWrap{padding:10px;border-bottom:1px solid var(--border);overflow:hidden}
  #timeline{width:100%;height:250px;display:block;background:#080c12;border:1px solid var(--border);border-radius:12px}
  .section{padding:10px;overflow:auto;-webkit-overflow-scrolling:touch}
  #tracks{display:grid;gap:7px}
  .track{display:grid;grid-template-columns:minmax(150px,1fr) auto 92px auto auto;gap:8px;align-items:center;
    padding:9px 10px;border:1px solid var(--border);background:var(--panel);border-radius:11px}
  .track strong{font-size:13px}
  .track small{color:var(--muted);font-size:11px;line-height:1.3}
  .chip{font-size:10px;padding:3px 6px;border:1px solid var(--border);border-radius:999px;color:var(--muted);white-space:nowrap}
  .toggle{min-width:40px;padding:6px 9px;font-weight:750}
  .toggle.active{background:#28445a;border-color:#477a9c}
  .meter{width:92px;min-width:92px;display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center}
  .meter-rail{position:relative;height:9px;overflow:visible;border-radius:999px;background:#070a0f;border:1px solid #283147}
  .meter-fill{position:absolute;inset:0 auto 0 0;width:0%;border-radius:999px;background:linear-gradient(90deg,#5796b7 0 68%,#d8b45b 82%,#d9646d 100%);transition:width .08s linear}
  .meter-peak{position:absolute;top:-2px;bottom:-2px;width:2px;left:0%;background:#f2e6ac;opacity:.9}
  .meter-readout{width:34px;text-align:right;font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
  .meter.clip .meter-rail{border-color:#d95b68;box-shadow:0 0 0 1px rgba(217,91,104,.28)}
  .meter.clip .meter-readout{color:#ff7e8a;font-weight:700}
  .clip-badge{display:none;position:absolute;right:0;top:-16px;font:9px ui-monospace,monospace;color:#ff7e8a}
  .meter.clip .clip-badge{display:block}
  .hint{color:var(--muted);font-size:11px;padding:8px 2px 2px}

  footer{border-top:1px solid var(--border);background:#0d121a;padding:7px 12px}
  #errors{max-height:110px;overflow:auto;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--bad);white-space:pre-wrap}
  #errors:empty::after{content:"No diagnostics";color:var(--muted)}

  @media (max-width:850px){
    html,body{width:100%;height:100%;overflow:hidden}
    .app{width:100%;height:100dvh;min-height:0;display:flex;flex-direction:column;
      overflow:hidden;padding-bottom:calc(70px + var(--safe-bottom))}
    header{position:relative;z-index:1;flex:0 0 auto;padding:8px 10px;background:#0d121a}
    .persistent-controls{position:relative;top:auto;z-index:30;flex:0 0 auto;
      padding:7px 10px 8px;background:rgba(13,18,26,.98);backdrop-filter:blur(12px)}
    .persistent-control-label{display:block}
    .brand-row{height:32px}
    .brand{font-size:15px}
    .brand-badge{display:none}
    .status{font-size:11px;max-width:42vw}
    .song-row{grid-template-columns:1fr auto auto;gap:7px;width:100%}
    .song-row > label[for="sampleSelect"]{display:none}
    #sampleSelect{display:block!important;visibility:visible!important;opacity:1!important;
      grid-column:1 / -1;width:100%;min-width:0;font-size:16px;min-height:48px}
    #loadSampleBtn{min-height:46px;padding-inline:14px;font-weight:700}
    .persistent-compile{min-height:46px;padding-inline:14px}
    .persistent-bpm{display:flex!important;min-height:46px;align-items:center;justify-content:center;
      background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px 8px;font-size:11px}
    .persistent-bpm input{width:68px;min-height:36px;font-size:16px;padding:6px 7px}
    .mobile-tabs{display:flex;position:relative;z-index:10;flex:0 0 auto;background:#0d121a}

    .tool-panel{display:none;flex:0 0 auto;padding:0;background:#0c1119;border-bottom:1px solid var(--border)}
    .tool-controls{display:grid;padding:12px 10px;grid-template-columns:1fr 1fr;background:#0c1119}
    .app.mobile-view-tools .tool-panel{display:block}
    .tool-controls button{min-height:48px}
    .tool-controls label{min-height:48px;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:6px 10px;justify-content:space-between}
    #tempoInput{font-size:16px}

    .transport-controls{position:fixed;left:0;right:0;bottom:0;z-index:40;
      box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;
      padding:9px 10px calc(9px + var(--safe-bottom));
      background:rgba(10,14,21,.96);border-top:1px solid var(--border);backdrop-filter:blur(12px)}
    .transport-controls #playBtn,.transport-controls #stopBtn{min-width:0;min-height:52px;font-size:16px;border-radius:13px}
    .transport-controls #transportState{align-self:center;height:36px}
    .transport-spacer{display:none}

    main{display:block;flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;
      overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
    .editor-pane{display:none;border:0}
    .preview-pane{display:flex;overflow:visible;min-height:0}
    .app.mobile-view-source .editor-pane{display:flex}
    .app.mobile-view-source .preview-pane{display:none}
    .app.mobile-view-tools main{display:none}
    .app.mobile-view-tools footer{display:block}
    .app.mobile-view-mixer .editor-pane{display:none}
    .app.mobile-view-mixer .preview-pane{display:flex}

    .app.mobile-view-source main{overflow:hidden}
    .app.mobile-view-source .editor-pane{height:100%;min-height:0}
    #editor{height:100%;min-height:0;flex:1 1 auto;font-size:16px;line-height:1.55;padding:13px;
      overflow:auto;-webkit-overflow-scrolling:touch}
    #timelineWrap{padding:8px}
    #timeline{height:205px;border-radius:10px}
    .section{padding:8px;overflow:visible;min-height:0}
    #tracks{gap:6px}
    .track{grid-template-columns:minmax(0,1fr) auto auto;padding:10px 9px;gap:7px;min-height:68px}
    .track > div:first-child{grid-column:1 / -1;min-width:0}
    .track > div:first-child strong{font-size:14px}
    .track > div:first-child small{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .track .chip{grid-column:1}
    .track .meter{grid-column:1;grid-row:auto;width:100%;min-width:0}
    .track .toggle{min-width:46px;min-height:42px;font-size:13px}
    .meter-readout{display:none}
    .meter-rail{height:10px}
    .hint{display:none}
    footer{flex:0 0 auto;padding:6px 10px}
    #errors{max-height:76px;font-size:10px}
    .busy-card{min-height:62px}
    .app.busy main,.app.busy footer{filter:blur(.8px) brightness(.7)}
  }

  @media (max-width:380px){
    .status{max-width:34vw}
    .transport-controls{grid-template-columns:1fr 1fr}
    .transport-controls #transportState{display:none}
    .mobile-tab{font-size:11px;padding-inline:5px}
  }
</style>
</head>
<body>
<div class="app mobile-view-mixer" id="appRoot" aria-busy="false">
  <div class="busy-overlay" id="busyOverlay" aria-live="polite" aria-hidden="true">
    <div class="busy-card"><span class="spinner"></span><span id="busyText">Compiling…</span></div>
  </div>

  <header>
    <div class="brand-row">
      <div class="brand">soraotoDSL Player</div>
      <span class="brand-badge">WASM Audio</span>
      <span id="status" class="status">Ready</span>
    </div>
    <div class="transport-controls">
      <button id="playBtn" class="primary" aria-label="Play">▶ Play</button>
      <button id="stopBtn" class="danger" aria-label="Stop">■ Stop</button>
      <span class="transport-spacer"></span>
      <span id="transportState" class="state-pill">Stopped</span>
    </div>
  </header>

  <section class="persistent-controls" aria-label="Song controls">
    <div class="persistent-control-label">曲選択</div>

    <div class="song-row persistent-song-picker">
      <label for="sampleSelect">Song</label>
      <select id="sampleSelect" aria-label="Song"><option>Loading…</option></select>
      <button id="loadSampleBtn">Load</button>
      <button id="compileBtn" class="persistent-compile">Compile</button>
      <label class="persistent-bpm">BPM <input id="tempoInput" type="number" min="20" max="320" step="1" value="120"></label>
    </div>
  </section>

  <nav class="mobile-tabs" aria-label="Player view">
    <button class="mobile-tab active" id="mobileMixerBtn" data-mobile-view="mixer">Mixer</button>
    <button class="mobile-tab" id="mobileSourceBtn" data-mobile-view="source">Source</button>
    <button class="mobile-tab" id="mobileToolsBtn" data-mobile-view="tools">Tools</button>
  </nav>

  <section class="tool-panel" id="toolPanel">
    <div class="tool-controls" id="toolControls">
      <button id="refreshSongsBtn">Refresh songs</button>
      <button id="exportMidiBtn">Export MIDI</button>
      <button id="exportGarageBandBtn">GarageBand MIDI</button>
      <button id="renderWavBtn">Render WAV</button>
      <button id="debugToggleBtn">Debug Log</button>
      <label class="debug-trace-toggle"><span>Audio trace</span><input id="debugAudioTrace" type="checkbox"></label>
    </div>
    <section class="debug-panel" id="debugPanel" hidden aria-label="Debug log">
      <div class="debug-toolbar"><strong>Debug Log</strong><span id="debugSummary">idle</span><span class="spacer"></span><button id="debugClearBtn">Clear</button><button id="debugCopyBtn">Copy</button></div>
      <pre class="debug-log" id="debugLog" aria-live="polite"></pre>
    </section>
  </section>

  <main>
    <section class="editor-pane">
      <div class="pane-title"><span>soraotoDSL source</span><span>Editable</span></div>
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </section>

    <section class="preview-pane">
      <div class="pane-title"><span>Timeline / Mixer</span><span id="mobileTimelineHint">overview</span></div>
      <div id="timelineWrap"><canvas id="timeline"></canvas></div>
      <div class="section">
        <div id="tracks"></div>
        <div class="hint">Harmony / tracks / buses / meters / mute / solo</div>
      </div>
    </section>
  </main>

  <footer><div id="errors"></div></footer>
</div>

<script>window.SORAOTO_BUILD_ID="20260923-runtime-generation-fix-7";</script>
<script src="assets/js/compiler.js?v=20260923-runtime-generation-fix-7"></script>
<script src="assets/js/midi-export.js?v=20260923-runtime-generation-fix-7"></script>
<script src="assets/js/wav-export.js?v=20260923-runtime-generation-fix-7"></script>
<script src="assets/js/plugin-cbor.js?v=20260923-runtime-generation-fix-7"></script>
<script src="assets/js/plugin-interface.js?v=20260923-runtime-generation-fix-7"></script>
<script src="assets/js/plugin-host.js?v=20260923-runtime-generation-fix-7"></script>
<script src="assets/js/plugin-registry.js?v=20260923-runtime-generation-fix-7"></script>
<script src="assets/js/audio-graph.js?v=20260923-runtime-generation-fix-7"></script>
<script src="assets/js/instrument-library.js?v=20260923-runtime-generation-fix-7"></script>
<script src="assets/js/app.js?v=20260923-runtime-generation-fix-7"></script>
</body>
</html>
